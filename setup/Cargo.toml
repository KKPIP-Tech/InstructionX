[package]
name = "instructionx-setup"
version = "0.1.0"
edition = "2024"
description = "InstructionX native cross-platform setup TUI"
license = "AGPL-3.0-or-later"

[lib]
name = "instructionx_setup"
path = "src/lib.rs"

[[bin]]
name = "instructionx-setup"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
flate2 = "1"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
tar = "0.4"
thiserror = "2"
toml = "0.8"
unicode-width = "0.2"
url = "2"
zip = "9.0.5"

[target.'cfg(windows)'.dependencies]
wmi = "0.15"

[dev-dependencies]
tempfile = "3"
